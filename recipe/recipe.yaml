schema_version: 1

context:
  version: "0.7.8"
  python_min: "3.10"

recipe:
  name: interpret
  version: ${{ version }}

source:
  url: https://github.com/interpretml/interpret/archive/v${{ version }}.tar.gz
  sha256: b92dffefc5adec3aa681e7efb981ad000f31f489855e0b5996e5080e4ff17bce

build:
  number: 0

outputs:
  - package:
      name: libebm

    build:
      script:
        - if: win
          then:
            - .\build.bat -conda -release_64 && copy .\bld\lib\libebm_win_x64.dll %LIBRARY_BIN%\libebm.dll && copy .\bld\lib\libebm_win_x64.lib %LIBRARY_LIB%\libebm.lib
        - if: linux
          then:
            - sh ./build.sh -conda
            - cp ./bld/lib/libebm.so "$PREFIX/lib/libebm.so"
        - if: osx
          then:
            - sh ./build.sh -conda
            - cp ./bld/lib/libebm.dylib "$PREFIX/lib/libebm.dylib"

    requirements:
      build:
        - ${{ stdlib("c") }}
        - ${{ compiler('cxx') }}
      run_exports:
        - ${{ pin_subpackage('libebm', upper_bound='x.x.x') }}

    tests:
      - package_contents:
          lib:
            - libebm

  - package:
      name: interpret-core

    build:
      noarch: python
      script: cd ./python/interpret-core/ && ${{ PYTHON }} -m pip install . -vv

    requirements:
      build:
        # specifying nodejs ==x.* prevents us from building it 3 times for different versions of nodejs
        - nodejs 22.*
      host:
        - python ${{ python_min }}.*
        - pip
        - setuptools
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage('libebm', upper_bound='x.x.x') }}
        - numpy >=1.25
        - pandas >=0.24
        - scikit-learn >=1.6.0
        - joblib >=0.11

    tests:
      - python:
          imports:
            - interpret
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - "*"
      - files:
          source:
            - python/interpret-core/tests/**
        requirements:
          run:
            - python ${{ python_min }}.*
            - pip
            - psutil >=5.6.2
            - ipython >=5.5.0
            - plotly >=3.8.1
            - SALib >=1.3.3
            - shap >=0.28.5
            - ipywidgets >=7.4.2
            - scikit-learn >=1.6.0
            - dash >=2.0.0
            - dash_cytoscape >=0.1.1
            - flask >=1.0.4
            - gevent >=1.3.6
            - requests >=2.19.0
            - scipy >=0.18.1
            - pytest >=4.3.0
            - pytest-xdist >=1.29
            - nbconvert >=5.4.1
            - nbformat >=4.4.0
            - selenium >=3.141.0
            - pytest-cov >=2.6.1
        script:
          - python -m pytest -vv -n auto --junitxml=junit/test-results.xml --cov=interpret --cov-report=xml --cov-report=html python/interpret-core/tests --ignore=python/interpret-core/tests/glassbox/test_aplr.py

  - package:
      name: interpret

    build:
      noarch: python
      script: cd ./python/interpret/ && ${{ PYTHON }} -m pip install . -vv

    requirements:
      host:
        - python ${{ python_min }}.*
        - pip
        - setuptools
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage('interpret-core', upper_bound='x.x.x') }}
        # Equiv. to extras.
        - psutil >=5.6.2
        - ipython >=5.5.0
        - plotly >=3.8.1
        # - lime >=0.1.1.33  # no longer maintained
        - SALib >=1.3.3
        - shap >=0.28.5
        - ipywidgets >=7.4.2
        - scikit-learn >=1.6.0
        # - skope-rules >=1.0.1   fails on python 3.10
        # - treeinterpreter >=0.2.2  # no longer maintained
        - dash >=2.0.0
        - dash_cytoscape >=0.1.1
        - flask >=1.0.4
        - gevent >=1.3.6
        - requests >=2.19.0

    tests:
      - python:
          imports:
            - interpret
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - "*"
      - files:
          source:
            - python/interpret-core/tests/**
        requirements:
          run:
            - python ${{ python_min }}.*
            - pip
            - scipy >=0.18.1
            - pytest >=4.3.0
            - pytest-xdist >=1.29
            - nbconvert >=5.4.1
            - nbformat >=4.4.0
            - selenium >=3.141.0
            - pytest-cov >=2.6.1
        script:
          - python -m pytest -vv -n auto --junitxml=junit/test-results.xml --cov=interpret --cov-report=xml --cov-report=html python/interpret-core/tests --ignore=python/interpret-core/tests/glassbox/test_aplr.py

about:
  summary: Fit interpretable models. Explain blackbox machine learning.
  description: |
    In the beginning machines learned in darkness, and data scientists struggled in the void to explain them.

    Let there be light.

    https://github.com/interpretml/interpret
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/interpretml/interpret
  repository: https://interpret.ml/docs/installation-guide.html
  documentation: https://interpret.ml/docs

extra:
  recipe-maintainers:
    - paulbkoch
    - interpret-ml
    - mgorny
